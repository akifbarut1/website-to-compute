<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SyntoTech Header</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .logo {
      font-size: 26px;
      font-weight: bold;
    }
    .logo span:first-child {
      color: #075777;
    }
    .logo span:last-child {
      color: #4E5C5F;
    }
    nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #4E5C5F;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #075777;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      nav {
        margin-top: 10px;
      }
      nav a {
        display: block;
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>Synto</span><span>Tech</span>
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

</body>
</html>
